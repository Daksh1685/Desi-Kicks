steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/desi-kicks:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/desi-kicks:latest', '.']

  # 2. Push container image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/desi-kicks:$COMMIT_SHA']

  # 3. Deploy container to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'desi-kicks'
      - '--image'
      - 'gcr.io/$PROJECT_ID/desi-kicks:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/desi-kicks:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/desi-kicks:latest'
